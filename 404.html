<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | 소녀전선2 장비 파밍 도우미</title>
  <script>
    (() => {
      const key = 'gf2-ui-theme-v1';
      try {
        const saved = localStorage.getItem(key);
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1b2430;
      --line: #2b3948;
      --text: #edf3f8;
      --muted: #93a4b7;
      --faint: #65778b;
      --accent: #58d6c8;
      --accent-soft: rgba(88, 214, 200, .14);
      --warning: #ffbd69;
      --body-glow-1: rgba(42, 113, 111, .22);
      --body-glow-2: rgba(66, 83, 130, .18);
      --header-bg: rgba(13, 17, 23, .91);
      --header-line: rgba(43, 57, 72, .85);
      --primary-contrast: #08201d;
      --shadow: 0 20px 60px rgba(0, 0, 0, .28);
      --grid-line: rgba(88, 214, 200, .045);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef3f6;
      --panel: #ffffff;
      --panel-2: #f4f7f9;
      --line: #cbd7de;
      --text: #17262d;
      --muted: #526871;
      --faint: #748790;
      --accent: #087f75;
      --accent-soft: rgba(8, 127, 117, .12);
      --warning: #a65b00;
      --body-glow-1: rgba(31, 151, 140, .15);
      --body-glow-2: rgba(83, 108, 181, .12);
      --header-bg: rgba(248, 251, 252, .94);
      --header-line: rgba(190, 205, 213, .92);
      --primary-contrast: #ffffff;
      --shadow: 0 20px 54px rgba(41, 65, 76, .16);
      --grid-line: rgba(8, 127, 117, .055);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        radial-gradient(900px 500px at 8% -8%, var(--body-glow-1), transparent 65%),
        radial-gradient(800px 440px at 100% 0, var(--body-glow-2), transparent 62%),
        var(--bg);
      background-size: 34px 34px, 34px 34px, auto, auto, auto;
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, a { font: inherit; }

    .app-header {
      border-bottom: 1px solid var(--header-line);
      background: var(--header-bg);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1180px, 100%);
      min-height: 72px;
      margin: 0 auto;
      padding: 14px 22px;
      gap: 18px;
    }

    .brand-kicker {
      margin: 0 0 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .2em;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(17px, 3vw, 22px);
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    .theme-toggle {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      transition: .15s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .page-shell {
      display: grid;
      place-items: center;
      width: min(1180px, 100%);
      min-height: calc(100dvh - 73px);
      margin: 0 auto;
      padding: 42px 22px;
    }

    .error-panel {
      position: relative;
      width: min(720px, 100%);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--panel) 93%, transparent);
      box-shadow: var(--shadow);
    }

    .error-panel::before,
    .error-panel::after {
      content: "";
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    .error-panel::before {
      top: -1px;
      right: 18px;
      width: 86px;
      height: 4px;
      background: var(--warning);
      clip-path: polygon(0 0, 93% 0, 100% 100%, 7% 100%);
    }

    .error-panel::after {
      left: -1px;
      bottom: 28px;
      width: 4px;
      height: 78px;
      background: var(--accent);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .panel-label {
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .18em;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 750;
    }

    .signal::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning) 16%, transparent);
    }

    .panel-body {
      padding: clamp(30px, 7vw, 62px);
    }

    .error-code {
      margin: 0;
      color: var(--accent);
      font-size: clamp(72px, 20vw, 152px);
      font-weight: 950;
      line-height: .8;
      letter-spacing: -.085em;
      opacity: .95;
    }

    h1 {
      margin: 28px 0 0;
      font-size: clamp(25px, 5vw, 42px);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .description {
      max-width: 540px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .path-box {
      margin-top: 24px;
      padding: 12px 14px;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--faint);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: .15s ease;
      font-size: 13px;
      font-weight: 800;
    }

    .button:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--primary-contrast);
    }

    @media (max-width: 560px) {
      .header-inner { padding-inline: 15px; }
      .page-shell { padding: 24px 14px; }
      .panel-head { padding: 15px 17px; }
      .panel-body { padding: 34px 22px 38px; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <p class="brand-kicker">GF2 EQUIPMENT TERMINAL</p>
        <p class="brand-title">소녀전선2 장비 파밍 도우미</p>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="밝은 화면으로 전환" title="밝은 화면으로 전환">
        <span id="themeIcon" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main class="page-shell">
    <section class="error-panel" aria-labelledby="errorTitle">
      <div class="panel-head">
        <span class="panel-label">SYSTEM / NAVIGATION ERROR</span>
        <span class="signal">ROUTE NOT FOUND</span>
      </div>
      <div class="panel-body">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="errorTitle">페이지를 찾을 수 없습니다.</h1>
        <p class="description">
          요청한 주소가 존재하지 않거나 이동되었어요. 장비 파밍 도우미 메인 화면으로 돌아가 다시 찾아보세요.
        </p>
        <div id="requestedPath" class="path-box" aria-label="요청한 주소"></div>
        <div class="actions">
          <a class="button primary" href="/">장비 파밍 도우미로 돌아가기</a>
          <button id="backButton" class="button" type="button">이전 페이지</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const themeKey = 'gf2-ui-theme-v1';
      const root = document.documentElement;
      const button = document.getElementById('themeToggle');
      const icon = document.getElementById('themeIcon');
      const pathBox = document.getElementById('requestedPath');
      const backButton = document.getElementById('backButton');

      function applyTheme(theme) {
        const nextTheme = theme === 'light' ? 'light' : 'dark';
        root.dataset.theme = nextTheme;
        const isDark = nextTheme === 'dark';
        icon.textContent = isDark ? '☀' : '🌙';
        const label = isDark ? '밝은 화면으로 전환' : '어두운 화면으로 전환';
        button.setAttribute('aria-label', label);
        button.title = label;
      }

      applyTheme(root.dataset.theme);

      button.addEventListener('click', () => {
        const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        try { localStorage.setItem(themeKey, nextTheme); } catch (_) {}
      });

      pathBox.textContent = `${location.pathname}${location.search}${location.hash}`;

      backButton.addEventListener('click', () => {
        if (history.length > 1) history.back();
        else location.href = '/';
      });
    })();
  </script>
</body>
</html>
