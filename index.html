<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소녀전선2 장비 파밍 도우미</title>
  <link rel="icon" type="image/png" href="assets/gf2-site-logo.png">
  <link rel="apple-touch-icon" href="assets/gf2-site-logo.png">
  <script src="app-1.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1b2430;
      --panel-3: #222d3a;
      --line: #2b3948;
      --text: #edf3f8;
      --muted: #93a4b7;
      --faint: #65778b;
      --accent: #58d6c8;
      --accent-soft: rgba(88, 214, 200, .14);
      --warning: #ffbd69;
      --danger: #ff7a7a;
      --success: #72dd9c;
      --physical: #aeb9c6;
      --burn: #ff785f;
      --freeze: #72cfff;
      --electric: #f2d35f;
      --acid: #b58cff;
      --turbid: #639cff;
      --resonance: #ff6bb2;
      --shadow: 0 16px 44px rgba(0, 0, 0, .24);
      --body-glow-1: rgba(42, 113, 111, .22);
      --body-glow-2: rgba(66, 83, 130, .18);
      --header-bg: rgba(13, 17, 23, .91);
      --header-line: rgba(43, 57, 72, .85);
      --primary-contrast: #08201d;
      --active-text: #e1fffc;
      --summary-overlay: rgba(27, 36, 48, .8);
      --progress-track: #0b1016;
      --card-shadow: 0 9px 26px rgba(0, 0, 0, .12);
      --portrait-text: #fff;
      --tag-bg: rgba(255, 255, 255, .018);
      --option-text: #dce6ef;
      --unowned-text: #ffe0ae;
      --completed-text: #dcffe9;
      --check-text: #092013;
      --note-text: #f0c991;
      --table-head-text: #e4edf5;
      --modal-overlay: rgba(0, 0, 0, .68);
      --modal-sticky: rgba(21, 27, 35, .97);
      --toast-bg: #202b37;
      --toast-error-text: #ffd8d8;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef3f6;
      --panel: #ffffff;
      --panel-2: #f4f7f9;
      --panel-3: #e8eff3;
      --line: #cbd7de;
      --text: #17262d;
      --muted: #526871;
      --faint: #748790;
      --accent: #087f75;
      --accent-soft: rgba(8, 127, 117, .12);
      --warning: #a65b00;
      --danger: #c24141;
      --success: #238a52;
      --physical: #66737c;
      --burn: #d9533f;
      --freeze: #167ea8;
      --electric: #9a7900;
      --acid: #7650b7;
      --turbid: #346cbf;
      --resonance: #b83978;
      --shadow: 0 16px 40px rgba(41, 65, 76, .16);
      --body-glow-1: rgba(31, 151, 140, .15);
      --body-glow-2: rgba(83, 108, 181, .12);
      --header-bg: rgba(248, 251, 252, .94);
      --header-line: rgba(190, 205, 213, .92);
      --primary-contrast: #ffffff;
      --active-text: #075f58;
      --summary-overlay: rgba(235, 242, 246, .86);
      --progress-track: #dce6eb;
      --card-shadow: 0 9px 24px rgba(48, 74, 86, .09);
      --portrait-text: #263a43;
      --tag-bg: rgba(20, 45, 55, .035);
      --option-text: #2c414a;
      --unowned-text: #8b4e00;
      --completed-text: #17683c;
      --check-text: #ffffff;
      --note-text: #855310;
      --table-head-text: #2b414a;
      --modal-overlay: rgba(32, 50, 58, .38);
      --modal-sticky: rgba(255, 255, 255, .97);
      --toast-bg: #ffffff;
      --toast-error-text: #982f2f;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      margin: 0;
      min-height: 0;
      height: 100dvh;
      background:
        radial-gradient(900px 500px at 8% -8%, var(--body-glow-1), transparent 65%),
        radial-gradient(800px 440px at 100% 0, var(--body-glow-2), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    a { color: var(--accent); }

    .app-header {
      position: relative;
      z-index: 30;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--header-line);
      background: var(--header-bg);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 18px 22px 14px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .button {
      min-height: 39px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      cursor: pointer;
      transition: .15s ease;
      font-size: 13px;
      font-weight: 750;
    }

    .button:hover { border-color: var(--accent); transform: translateY(-1px); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--primary-contrast); }
    .button.ghost { background: transparent; }
    .button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .button.small { min-height: 33px; padding: 6px 10px; font-size: 12px; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 40px; padding-inline: 8px; }
    .theme-toggle .theme-icon { width: 1.1em; text-align: center; }

    .tabs {
      display: flex;
      gap: 5px;
      margin-top: 15px;
      overflow-x: auto;
    }

    .tab-button {
      flex: none;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }

    .tab-button.active {
      border-color: rgba(88, 214, 200, .38);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .view {
      display: none;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .view.active { display: block; }

    .view-inner {
      width: min(1480px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 20px 22px 70px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      height: 45px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--panel);
      color: var(--text);
    }

    .search-box input:focus { border-color: var(--accent); }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .filter-chip {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .filter-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
    }

    .summary-card {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(145deg, var(--panel), var(--summary-overlay));
    }

    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-value { margin-top: 4px; font-size: 24px; font-weight: 900; letter-spacing: -.03em; }

    .progress-line {
      height: 7px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-track);
    }

    .progress-line > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--success));
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
    }

    .doll-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--card-shadow);
    }

    .doll-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--attr-color, var(--faint));
    }

    .doll-card.status-unowned { opacity: .68; }
    .doll-card.status-completed { border-color: rgba(114, 221, 156, .52); }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .card-identity {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .identity-text { min-width: 0; flex: 1; }

    .doll-portrait {
      position: relative;
      width: 88px;
      height: 112px;
      flex: none;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--attr-color) 48%, var(--line));
      border-radius: 10px;
      background:
        linear-gradient(150deg, color-mix(in srgb, var(--attr-color) 24%, transparent), transparent 64%),
        var(--panel-3);
      color: var(--portrait-text);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .doll-portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      background:
        radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--attr-color) 18%, transparent), transparent 62%),
        var(--panel-3);
      opacity: 0;
      transition: opacity .18s ease;
      image-rendering: auto;
    }

    .doll-portrait img.loaded { opacity: 1; }
    .doll-portrait .portrait-fallback { opacity: .9; }
    .doll-portrait.empty .portrait-fallback::after {
      content: "일러스트 없음";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 7px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0;
      text-align: center;
    }

    .doll-name { margin: 0; font-size: 21px; letter-spacing: -.02em; }

    .meta-row, .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .meta-row { margin-top: 6px; }

    .tag, .option-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--tag-bg);
      font-size: 12px;
      font-weight: 700;
    }

    .tag.attr { color: var(--attr-color); border-color: color-mix(in srgb, var(--attr-color) 48%, var(--line)); }
    .option-tag { color: var(--option-text); background: var(--panel-2); }
    .option-tag.set { color: var(--warning); }

    .status-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      max-width: 240px;
    }

    .status-chip {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
      transition: .15s ease;
    }

    .status-chip:hover { transform: translateY(-1px); }

    .status-chip.active[data-status="tracked"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .status-chip.active[data-status="unowned"] {
      border-color: rgba(255, 189, 105, .65);
      background: rgba(255, 189, 105, .12);
      color: var(--unowned-text);
    }

    .status-chip.active[data-status="completed"] {
      border-color: rgba(114, 221, 156, .7);
      background: rgba(114, 221, 156, .13);
      color: var(--completed-text);
    }

    .config-block {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px dashed var(--line);
    }

    .config-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .piece-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 11px;
    }

    .piece-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 43px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
    }

    .piece-button .checkmark {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid var(--faint);
      border-radius: 5px;
      color: transparent;
    }

    .piece-button.done {
      border-color: rgba(114, 221, 156, .55);
      background: rgba(114, 221, 156, .1);
      color: var(--completed-text);
    }

    .piece-button.done .checkmark {
      border-color: var(--success);
      background: var(--success);
      color: var(--check-text);
    }

    .card-note, .key-box {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .card-note { border: 1px solid rgba(255, 189, 105, .34); color: var(--note-text); }
    .key-box strong { color: var(--accent); }

    .personal-note-field {
      display: block;
      margin-top: 10px;
    }

    .personal-note-field span {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
    }

    .personal-note-field textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }

    .personal-note-field textarea:focus { border-color: var(--accent); }


    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
    }

    .empty-state, .loading-state {
      padding: 60px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .reference-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .reference-section {
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .reference-section summary {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      user-select: none;
    }

    .table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }

    table {
      width: 100%;
      min-width: 1260px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    th, td {
      padding: 9px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      line-height: 1.5;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel-3);
      color: var(--table-head-text);
      white-space: nowrap;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 210px;
      min-width: 210px;
      background: var(--panel-2);
      font-weight: 800;
    }

    .reference-table col.option-col { width: 210px; }
    .reference-table col.weapon-col { width: 150px; }

    th:first-child { z-index: 3; background: var(--panel-3); }

    .cell-names { color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--modal-overlay);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(880px, 100%);
      max-height: min(90vh, 920px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .modal-header, .modal-footer {
      position: sticky;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
      background: var(--modal-sticky);
    }

    .modal-header { top: 0; border-bottom: 1px solid var(--line); }
    .modal-footer { bottom: 0; border-top: 1px solid var(--line); }
    .modal-header h2 { margin: 0; font-size: 22px; }
    .modal-body { padding: 16px; }

    .editor-group {
      margin-bottom: 18px;
      padding-bottom: 17px;
      border-bottom: 1px dashed var(--line);
    }

    .editor-group:last-child { border-bottom: 0; }

    .editor-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .editor-heading strong { font-size: 14px; }
    .editor-heading span { color: var(--muted); font-size: 12px; }

    .choice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .choice-chip {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .choice-chip.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .choice-chip.recommended::after {
      content: "추천";
      margin-left: 5px;
      color: var(--warning);
      font-size: 8px;
      vertical-align: 1px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: min(400px, calc(100vw - 36px));
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--toast-bg);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: .2s ease;
      font-size: 13px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: rgba(255, 122, 122, .55); color: var(--toast-error-text); }

    .source-line {
      margin-top: 20px;
      color: var(--faint);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 800px) {
      .title-row { display: block; }
      .header-actions { justify-content: flex-start; margin-top: 12px; }
      .toolbar { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .header-inner, .view-inner { padding-left: 13px; padding-right: 13px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
      .summary-value { font-size: 20px; }
      .piece-grid { grid-template-columns: 1fr 1fr; }
      .button { padding-left: 9px; padding-right: 9px; }
      .card-head { display: block; }
      .card-identity { align-items: center; }
      .doll-portrait { width: 76px; height: 96px; }
      .status-controls { justify-content: flex-start; max-width: none; margin-top: 10px; }
    }


    /* v6 · GF2-inspired tactical interface */
    :root {
      --bg: #0b1112;
      --panel: #121b1d;
      --panel-2: #182426;
      --panel-3: #203033;
      --line: #34484b;
      --text: #edf5f3;
      --muted: #9aadaa;
      --faint: #667b79;
      --accent: #60d6c5;
      --accent-soft: rgba(96, 214, 197, .13);
      --warning: #f1ad54;
      --danger: #ff7770;
      --success: #70d79b;
      --header-bg: rgba(10, 16, 17, .94);
      --header-line: rgba(71, 101, 104, .72);
      --summary-overlay: rgba(22, 35, 37, .84);
      --card-shadow: 0 14px 34px rgba(0, 0, 0, .24);
      --grid-line: rgba(119, 177, 171, .055);
      --panel-sheen: rgba(255, 255, 255, .022);
      --orange-soft: rgba(241, 173, 84, .13);
    }

    :root[data-theme="light"] {
      --bg: #e9efee;
      --panel: #fbfdfc;
      --panel-2: #f0f5f4;
      --panel-3: #e2eae8;
      --line: #b8c9c6;
      --text: #172523;
      --muted: #536966;
      --faint: #7c908d;
      --accent: #168f83;
      --accent-soft: rgba(22, 143, 131, .11);
      --warning: #ae670f;
      --danger: #c84c47;
      --success: #25824e;
      --header-bg: rgba(247, 250, 249, .96);
      --header-line: rgba(161, 184, 180, .82);
      --summary-overlay: rgba(238, 244, 242, .9);
      --card-shadow: 0 12px 28px rgba(47, 71, 68, .11);
      --grid-line: rgba(42, 91, 86, .06);
      --panel-sheen: rgba(255, 255, 255, .72);
      --orange-soft: rgba(174, 103, 15, .09);
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        radial-gradient(1000px 520px at 4% -14%, var(--body-glow-1), transparent 66%),
        radial-gradient(900px 480px at 103% -8%, var(--body-glow-2), transparent 64%);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .app-header {
      border-bottom: 1px solid var(--header-line);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
    }

    .app-header::after { content: none; }

    .header-inner { padding-top: 15px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .22em;
    }

    .eyebrow::before {
      content: "";
      width: 19px;
      height: 2px;
      background: var(--warning);
      box-shadow: 7px 0 0 color-mix(in srgb, var(--warning) 40%, transparent);
    }

    h1 {
      font-weight: 900;
      text-transform: none;
    }

    .button,
    .filter-chip,
    .status-chip,
    .piece-button,
    .choice-chip,
    .search-box input,
    .personal-note-field textarea {
      border-radius: 4px;
    }

    .button {
      position: relative;
      overflow: hidden;
      letter-spacing: -.01em;
    }

    .button::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 2px;
      background: var(--accent);
      opacity: .75;
    }

    .button.primary::after { background: var(--primary-contrast); }

    .tabs {
      gap: 20px;
      margin-top: 13px;
      border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      padding-top: 8px;
    }

    .tab-button {
      position: relative;
      padding: 7px 2px 9px;
      border: 0;
      border-radius: 0;
      font-size: 13px;
      letter-spacing: .025em;
    }

    .tab-button::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      transition: right .18s ease;
    }

    .tab-button.active {
      border: 0;
      background: transparent;
      color: var(--text);
    }

    .tab-button.active::after { right: 0; }

    .view-inner { padding-top: 18px; }

    .toolbar {
      padding: 12px;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 46%),
        var(--panel);
      box-shadow: var(--card-shadow);
    }

    .search-box input {
      height: 43px;
      border-color: color-mix(in srgb, var(--line) 86%, transparent);
      background: var(--panel-2);
    }

    .filter-chip {
      border-radius: 3px;
      background: var(--panel-2);
      text-transform: none;
    }

    .filter-chip.active {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .summary-grid { gap: 8px; }

    .summary-card {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      background:
        linear-gradient(145deg, var(--panel-sheen), transparent 48%),
        linear-gradient(145deg, var(--panel), var(--summary-overlay));
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 18px;
      height: 2px;
      background: var(--warning);
    }

    .summary-label {
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .card-grid {
      grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
      gap: 10px;
    }

    .doll-card {
      isolation: isolate;
      padding: 12px 13px 13px;
      border-radius: 3px;
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 42%),
        linear-gradient(90deg, color-mix(in srgb, var(--attr-color) 4%, transparent), transparent 34%),
        var(--panel);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
    }

    .doll-card::before {
      width: 4px;
      box-shadow: 7px 0 20px color-mix(in srgb, var(--attr-color) 18%, transparent);
    }

    .doll-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      right: 0;
      width: 27px;
      height: 2px;
      background: var(--warning);
      opacity: .88;
    }

    .card-title-line {
      position: relative;
      min-width: 0;
      margin-bottom: 9px;
      padding: 0 2px 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
    }

    .card-title-line::after {
      content: "";
      position: absolute;
      left: 2px;
      bottom: -1px;
      width: 46px;
      height: 2px;
      background: var(--attr-color, var(--accent));
    }

    .card-identity {
      gap: 12px;
      align-items: stretch;
    }

    .doll-portrait {
      width: 110px;
      height: 144px;
      border-radius: 2px;
      border-color: color-mix(in srgb, var(--attr-color) 58%, var(--line));
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(150deg, color-mix(in srgb, var(--attr-color) 18%, transparent), transparent 64%),
        var(--panel-3);
      background-size: 15px 15px, 15px 15px, auto, auto;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--panel-sheen) 55%, transparent);
    }

    .doll-portrait::before {
      content: "DOLL";
      position: absolute;
      z-index: 2;
      top: 5px;
      left: 7px;
      color: color-mix(in srgb, var(--attr-color) 75%, var(--text));
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .18em;
      opacity: .72;
      pointer-events: none;
    }

    .doll-portrait {
      --portrait-scale: 3.5;
      --portrait-offset-y: -7%;
    }

    .doll-portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      transform: translateY(var(--portrait-offset-y)) scale(var(--portrait-scale));
      transform-origin: center top;
      background: transparent;
    }

    .doll-portrait .portrait-fallback {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 24px 9px 27px;
      color: var(--portrait-text);
      font-size: clamp(12px, 1.15vw, 17px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.04em;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
      transition: opacity .16s ease, visibility .16s ease;
    }

    .doll-portrait.has-image .portrait-fallback {
      opacity: 0;
      visibility: hidden;
    }

    .identity-text {
      display: flex;
      min-width: 0;
      min-height: 144px;
      flex: 1;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 1px;
    }

    .doll-name {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(20px, 2vw, 23px);
      font-weight: 950;
      line-height: 1.12;
      letter-spacing: -.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: keep-all;
    }

    .meta-row { margin-top: 0; }

    .tag,
    .option-tag {
      min-height: 21px;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10.5px;
      letter-spacing: .01em;
    }

    .status-controls {
      justify-content: flex-start;
      max-width: none;
      margin-top: 7px;
      gap: 4px;
    }

    .status-chip {
      min-height: 27px;
      padding: 4px 7px;
      border-radius: 3px;
      background: var(--panel-2);
      font-size: 10.5px;
    }

    .compact-config {
      margin-top: 7px;
    }

    .compact-config .config-title {
      margin-bottom: 4px;
    }

    .status-chip.active[data-status="tracked"] { box-shadow: inset 3px 0 0 var(--accent); }
    .status-chip.active[data-status="unowned"] { box-shadow: inset 3px 0 0 var(--warning); }
    .status-chip.active[data-status="completed"] { box-shadow: inset 3px 0 0 var(--success); }

    .config-block {
      margin-top: 9px;
      padding-top: 8px;
      border-top-style: solid;
      border-top-color: color-mix(in srgb, var(--line) 78%, transparent);
    }

    .config-title {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9.5px;
      letter-spacing: .11em;
    }

    .piece-grid {
      gap: 5px;
      margin-top: 8px;
    }

    .piece-button,
    .card-note,
    .key-box,
    .personal-note-field textarea {
      border-radius: 3px;
    }

    .piece-button {
      min-height: 38px;
      padding: 6px 8px;
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 52%),
        var(--panel-2);
    }

    .card-note,
    .key-box {
      margin-top: 8px;
      padding: 7px 9px;
    }

    .card-note {
      background: var(--orange-soft);
    }

    .personal-note-field { margin-top: 8px; }
    .personal-note-field span { margin-bottom: 4px; }
    .personal-note-field textarea {
      min-height: 54px;
      padding: 8px 9px;
    }

    .card-actions {
      padding-top: 9px;
    }

    .reference-section,
    .modal,
    .empty-state,
    .loading-state,
    .toast {
      border-radius: 3px;
    }

    .reference-section {
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    th { background: var(--panel-3); }

    :root[data-theme="light"] th { background: #e8eff3; }
    :root[data-theme="light"] th:first-child { background: #e1eaef; }

    @media (max-width: 900px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .doll-card { padding: 11px; }
      .card-title-line { margin-bottom: 8px; padding-bottom: 7px; }
      .doll-portrait { width: 102px; height: 134px; }
      .identity-text { min-height: 134px; }
      .doll-portrait { --portrait-scale: 3.25; --portrait-offset-y: -6%; }
    }

    @media (max-width: 480px) {
      .toolbar { padding: 9px; }
      .card-grid { gap: 8px; }
      .card-identity { gap: 9px; align-items: stretch; }
      .doll-portrait { width: 92px; height: 124px; }
      .identity-text { min-height: 124px; }
      .doll-name { font-size: 20px; }
      .doll-portrait { --portrait-scale: 3.05; --portrait-offset-y: -5%; }
      .status-chip { padding-inline: 6px; font-size: 10px; }
      .piece-grid { grid-template-columns: 1fr 1fr; }
    }



    /* v13: 카드 높이 통일, 장비 옵션 묶음, 인형별 일러스트 프리셋 */
    .card-grid {
      align-items: stretch;
      grid-auto-rows: 1fr;
    }

    .doll-card {
      min-height: 100%;
      height: 100%;
      align-self: stretch;
    }

    .card-identity { flex: 0 0 auto; }

    .gear-options-panel {
      display: grid;
      gap: 6px;
      margin-top: 9px;
      padding: 8px;
      border: 1px solid color-mix(in srgb, var(--line) 88%, transparent);
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 52%),
        var(--panel-2);
    }

    .gear-option-row {
      display: grid;
      grid-template-columns: 49px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 7px;
      min-height: 29px;
    }

    .gear-option-row + .gear-option-row {
      padding-top: 6px;
      border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    }

    .gear-option-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .gear-done-toggle {
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--faint);
      border-radius: 4px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 950;
      transition: .15s ease;
    }

    .gear-done-toggle:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .gear-done-toggle.done {
      border-color: var(--success);
      background: var(--success);
      color: var(--check-text);
    }

    .key-box {
      min-height: 78px;
      display: flex;
      flex-direction: column;
    }

    .key-box .key-effect {
      min-height: 3.1em;
      margin-top: 3px;
    }

    .key-box.empty strong { color: var(--faint); }

    .portrait-position,
    .portrait-zoom {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .portrait-position {
      transform: translate(var(--portrait-user-x, 0%), var(--portrait-user-y, -7%));
    }

    .portrait-zoom {
      transform: scale(var(--portrait-user-scale, 3.5));
      transform-origin: center top;
    }

    .portrait-zoom .portrait-image {
      transform: none;
      transform-origin: center center;
    }

    @media (max-width: 900px) {
      .card-grid { grid-auto-rows: auto; }
      .doll-card { min-height: 0; height: auto; }
    }
