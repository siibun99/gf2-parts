<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소녀전선2 장비 파밍 도우미</title>
  <link rel="icon" type="image/png" href="assets/gf2-site-logo.png">
  <link rel="apple-touch-icon" href="assets/gf2-site-logo.png">
  <script>
    (() => {
      const key = 'gf2-ui-theme-v1';
      try {
        const saved = localStorage.getItem(key);
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #151b23;
      --panel-2: #1b2430;
      --panel-3: #222d3a;
      --line: #2b3948;
      --text: #edf3f8;
      --muted: #93a4b7;
      --faint: #65778b;
      --accent: #58d6c8;
      --accent-soft: rgba(88, 214, 200, .14);
      --warning: #ffbd69;
      --danger: #ff7a7a;
      --success: #72dd9c;
      --physical: #aeb9c6;
      --burn: #ff785f;
      --freeze: #72cfff;
      --electric: #f2d35f;
      --acid: #b58cff;
      --turbid: #639cff;
      --resonance: #ff6bb2;
      --shadow: 0 16px 44px rgba(0, 0, 0, .24);
      --body-glow-1: rgba(42, 113, 111, .22);
      --body-glow-2: rgba(66, 83, 130, .18);
      --header-bg: rgba(13, 17, 23, .91);
      --header-line: rgba(43, 57, 72, .85);
      --primary-contrast: #08201d;
      --active-text: #e1fffc;
      --summary-overlay: rgba(27, 36, 48, .8);
      --progress-track: #0b1016;
      --card-shadow: 0 9px 26px rgba(0, 0, 0, .12);
      --portrait-text: #fff;
      --tag-bg: rgba(255, 255, 255, .018);
      --option-text: #dce6ef;
      --unowned-text: #ffe0ae;
      --completed-text: #dcffe9;
      --check-text: #092013;
      --note-text: #f0c991;
      --table-head-text: #e4edf5;
      --modal-overlay: rgba(0, 0, 0, .68);
      --modal-sticky: rgba(21, 27, 35, .97);
      --toast-bg: #202b37;
      --toast-error-text: #ffd8d8;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef3f6;
      --panel: #ffffff;
      --panel-2: #f4f7f9;
      --panel-3: #e8eff3;
      --line: #cbd7de;
      --text: #17262d;
      --muted: #526871;
      --faint: #748790;
      --accent: #087f75;
      --accent-soft: rgba(8, 127, 117, .12);
      --warning: #a65b00;
      --danger: #c24141;
      --success: #238a52;
      --physical: #66737c;
      --burn: #d9533f;
      --freeze: #167ea8;
      --electric: #9a7900;
      --acid: #7650b7;
      --turbid: #346cbf;
      --resonance: #b83978;
      --shadow: 0 16px 40px rgba(41, 65, 76, .16);
      --body-glow-1: rgba(31, 151, 140, .15);
      --body-glow-2: rgba(83, 108, 181, .12);
      --header-bg: rgba(248, 251, 252, .94);
      --header-line: rgba(190, 205, 213, .92);
      --primary-contrast: #ffffff;
      --active-text: #075f58;
      --summary-overlay: rgba(235, 242, 246, .86);
      --progress-track: #dce6eb;
      --card-shadow: 0 9px 24px rgba(48, 74, 86, .09);
      --portrait-text: #263a43;
      --tag-bg: rgba(20, 45, 55, .035);
      --option-text: #2c414a;
      --unowned-text: #8b4e00;
      --completed-text: #17683c;
      --check-text: #ffffff;
      --note-text: #855310;
      --table-head-text: #2b414a;
      --modal-overlay: rgba(32, 50, 58, .38);
      --modal-sticky: rgba(255, 255, 255, .97);
      --toast-bg: #ffffff;
      --toast-error-text: #982f2f;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      margin: 0;
      min-height: 0;
      height: 100dvh;
      background:
        radial-gradient(900px 500px at 8% -8%, var(--body-glow-1), transparent 65%),
        radial-gradient(800px 440px at 100% 0, var(--body-glow-2), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }

    a { color: var(--accent); }

    .app-header {
      position: relative;
      z-index: 30;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--header-line);
      background: var(--header-bg);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 18px 22px 14px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .button {
      min-height: 39px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      cursor: pointer;
      transition: .15s ease;
      font-size: 13px;
      font-weight: 750;
    }

    .button:hover { border-color: var(--accent); transform: translateY(-1px); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--primary-contrast); }
    .button.ghost { background: transparent; }
    .button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .button.small { min-height: 33px; padding: 6px 10px; font-size: 12px; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 40px; padding-inline: 8px; }
    .theme-toggle .theme-icon { width: 1.1em; text-align: center; }

    .tabs {
      display: flex;
      gap: 5px;
      margin-top: 15px;
      overflow-x: auto;
    }

    .tab-button {
      flex: none;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }

    .tab-button.active {
      border-color: rgba(88, 214, 200, .38);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .view {
      display: none;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .view.active { display: block; }

    .view-inner {
      width: min(1480px, 100%);
      min-height: 100%;
      margin: 0 auto;
      padding: 20px 22px 70px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      height: 45px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--panel);
      color: var(--text);
    }

    .search-box input:focus { border-color: var(--accent); }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .filter-chip {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .filter-chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
    }

    .summary-card {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(145deg, var(--panel), var(--summary-overlay));
    }

    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .summary-value { margin-top: 4px; font-size: 24px; font-weight: 900; letter-spacing: -.03em; }

    .progress-line {
      height: 7px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--progress-track);
    }

    .progress-line > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--success));
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
    }

    .doll-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--card-shadow);
    }

    .doll-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--attr-color, var(--faint));
    }

    .doll-card.status-unowned { opacity: .68; }
    .doll-card.status-completed { border-color: rgba(114, 221, 156, .52); }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .card-identity {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .identity-text { min-width: 0; flex: 1; }

    .doll-portrait {
      position: relative;
      width: 88px;
      height: 112px;
      flex: none;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--attr-color) 48%, var(--line));
      border-radius: 10px;
      background:
        linear-gradient(150deg, color-mix(in srgb, var(--attr-color) 24%, transparent), transparent 64%),
        var(--panel-3);
      color: var(--portrait-text);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .doll-portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      background:
        radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--attr-color) 18%, transparent), transparent 62%),
        var(--panel-3);
      opacity: 0;
      transition: opacity .18s ease;
      image-rendering: auto;
    }

    .doll-portrait img.loaded { opacity: 1; }
    .doll-portrait .portrait-fallback { opacity: .9; }
    .doll-portrait.empty .portrait-fallback::after {
      content: "일러스트 없음";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 7px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0;
      text-align: center;
    }

    .doll-name { margin: 0; font-size: 21px; letter-spacing: -.02em; }

    .meta-row, .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .meta-row { margin-top: 6px; }

    .tag, .option-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--tag-bg);
      font-size: 12px;
      font-weight: 700;
    }

    .tag.attr { color: var(--attr-color); border-color: color-mix(in srgb, var(--attr-color) 48%, var(--line)); }
    .option-tag { color: var(--option-text); background: var(--panel-2); }
    .option-tag.set { color: var(--warning); }

    .status-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      max-width: 240px;
    }

    .status-chip {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 800;
      transition: .15s ease;
    }

    .status-chip:hover { transform: translateY(-1px); }

    .status-chip.active[data-status="tracked"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .status-chip.active[data-status="unowned"] {
      border-color: rgba(255, 189, 105, .65);
      background: rgba(255, 189, 105, .12);
      color: var(--unowned-text);
    }

    .status-chip.active[data-status="completed"] {
      border-color: rgba(114, 221, 156, .7);
      background: rgba(114, 221, 156, .13);
      color: var(--completed-text);
    }

    .config-block {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px dashed var(--line);
    }

    .config-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .piece-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 11px;
    }

    .piece-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 43px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-weight: 800;
    }

    .piece-button .checkmark {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      flex: none;
      border: 1px solid var(--faint);
      border-radius: 5px;
      color: transparent;
    }

    .piece-button.done {
      border-color: rgba(114, 221, 156, .55);
      background: rgba(114, 221, 156, .1);
      color: var(--completed-text);
    }

    .piece-button.done .checkmark {
      border-color: var(--success);
      background: var(--success);
      color: var(--check-text);
    }

    .card-note, .key-box {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .card-note { border: 1px solid rgba(255, 189, 105, .34); color: var(--note-text); }
    .key-box strong { color: var(--accent); }

    .personal-note-field {
      display: block;
      margin-top: 10px;
    }

    .personal-note-field span {
      display: block;
      margin-bottom: 5px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .06em;
    }

    .personal-note-field textarea {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--panel-2);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
    }

    .personal-note-field textarea:focus { border-color: var(--accent); }


    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
    }

    .empty-state, .loading-state {
      padding: 60px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .reference-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .reference-section {
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel);
    }

    .reference-section summary {
      padding: 12px 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      user-select: none;
    }

    .table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }

    table {
      width: 100%;
      min-width: 1260px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    th, td {
      padding: 9px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
      line-height: 1.5;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel-3);
      color: var(--table-head-text);
      white-space: nowrap;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      width: 210px;
      min-width: 210px;
      background: var(--panel-2);
      font-weight: 800;
    }

    .reference-table col.option-col { width: 210px; }
    .reference-table col.weapon-col { width: 150px; }

    th:first-child { z-index: 3; background: var(--panel-3); }

    .cell-names { color: var(--muted); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--modal-overlay);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(880px, 100%);
      max-height: min(90vh, 920px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .modal-header, .modal-footer {
      position: sticky;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
      background: var(--modal-sticky);
    }

    .modal-header { top: 0; border-bottom: 1px solid var(--line); }
    .modal-footer { bottom: 0; border-top: 1px solid var(--line); }
    .modal-header h2 { margin: 0; font-size: 22px; }
    .modal-body { padding: 16px; }

    .editor-group {
      margin-bottom: 18px;
      padding-bottom: 17px;
      border-bottom: 1px dashed var(--line);
    }

    .editor-group:last-child { border-bottom: 0; }

    .editor-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .editor-heading strong { font-size: 14px; }
    .editor-heading span { color: var(--muted); font-size: 12px; }

    .choice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .choice-chip {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .choice-chip.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--active-text);
    }

    .choice-chip.recommended::after {
      content: "추천";
      margin-left: 5px;
      color: var(--warning);
      font-size: 8px;
      vertical-align: 1px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: min(400px, calc(100vw - 36px));
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--toast-bg);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: .2s ease;
      font-size: 13px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: rgba(255, 122, 122, .55); color: var(--toast-error-text); }

    .source-line {
      margin-top: 20px;
      color: var(--faint);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 800px) {
      .title-row { display: block; }
      .header-actions { justify-content: flex-start; margin-top: 12px; }
      .toolbar { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .header-inner, .view-inner { padding-left: 13px; padding-right: 13px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
      .summary-value { font-size: 20px; }
      .piece-grid { grid-template-columns: 1fr 1fr; }
      .button { padding-left: 9px; padding-right: 9px; }
      .card-head { display: block; }
      .card-identity { align-items: center; }
      .doll-portrait { width: 76px; height: 96px; }
      .status-controls { justify-content: flex-start; max-width: none; margin-top: 10px; }
    }


    /* v6 · GF2-inspired tactical interface */
    :root {
      --bg: #0b1112;
      --panel: #121b1d;
      --panel-2: #182426;
      --panel-3: #203033;
      --line: #34484b;
      --text: #edf5f3;
      --muted: #9aadaa;
      --faint: #667b79;
      --accent: #60d6c5;
      --accent-soft: rgba(96, 214, 197, .13);
      --warning: #f1ad54;
      --danger: #ff7770;
      --success: #70d79b;
      --header-bg: rgba(10, 16, 17, .94);
      --header-line: rgba(71, 101, 104, .72);
      --summary-overlay: rgba(22, 35, 37, .84);
      --card-shadow: 0 14px 34px rgba(0, 0, 0, .24);
      --grid-line: rgba(119, 177, 171, .055);
      --panel-sheen: rgba(255, 255, 255, .022);
      --orange-soft: rgba(241, 173, 84, .13);
    }

    :root[data-theme="light"] {
      --bg: #e9efee;
      --panel: #fbfdfc;
      --panel-2: #f0f5f4;
      --panel-3: #e2eae8;
      --line: #b8c9c6;
      --text: #172523;
      --muted: #536966;
      --faint: #7c908d;
      --accent: #168f83;
      --accent-soft: rgba(22, 143, 131, .11);
      --warning: #ae670f;
      --danger: #c84c47;
      --success: #25824e;
      --header-bg: rgba(247, 250, 249, .96);
      --header-line: rgba(161, 184, 180, .82);
      --summary-overlay: rgba(238, 244, 242, .9);
      --card-shadow: 0 12px 28px rgba(47, 71, 68, .11);
      --grid-line: rgba(42, 91, 86, .06);
      --panel-sheen: rgba(255, 255, 255, .72);
      --orange-soft: rgba(174, 103, 15, .09);
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        radial-gradient(1000px 520px at 4% -14%, var(--body-glow-1), transparent 66%),
        radial-gradient(900px 480px at 103% -8%, var(--body-glow-2), transparent 64%);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .app-header {
      border-bottom: 1px solid var(--header-line);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
    }

    .app-header::after { content: none; }

    .header-inner { padding-top: 15px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .22em;
    }

    .eyebrow::before {
      content: "";
      width: 19px;
      height: 2px;
      background: var(--warning);
      box-shadow: 7px 0 0 color-mix(in srgb, var(--warning) 40%, transparent);
    }

    h1 {
      font-weight: 900;
      text-transform: none;
    }

    .button,
    .filter-chip,
    .status-chip,
    .piece-button,
    .choice-chip,
    .search-box input,
    .personal-note-field textarea {
      border-radius: 4px;
    }

    .button {
      position: relative;
      overflow: hidden;
      letter-spacing: -.01em;
    }

    .button::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 2px;
      background: var(--accent);
      opacity: .75;
    }

    .button.primary::after { background: var(--primary-contrast); }

    .tabs {
      gap: 20px;
      margin-top: 13px;
      border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      padding-top: 8px;
    }

    .tab-button {
      position: relative;
      padding: 7px 2px 9px;
      border: 0;
      border-radius: 0;
      font-size: 13px;
      letter-spacing: .025em;
    }

    .tab-button::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 0;
      height: 2px;
      background: var(--accent);
      transition: right .18s ease;
    }

    .tab-button.active {
      border: 0;
      background: transparent;
      color: var(--text);
    }

    .tab-button.active::after { right: 0; }

    .view-inner { padding-top: 18px; }

    .toolbar {
      padding: 12px;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 46%),
        var(--panel);
      box-shadow: var(--card-shadow);
    }

    .search-box input {
      height: 43px;
      border-color: color-mix(in srgb, var(--line) 86%, transparent);
      background: var(--panel-2);
    }

    .filter-chip {
      border-radius: 3px;
      background: var(--panel-2);
      text-transform: none;
    }

    .filter-chip.active {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .summary-grid { gap: 8px; }

    .summary-card {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      background:
        linear-gradient(145deg, var(--panel-sheen), transparent 48%),
        linear-gradient(145deg, var(--panel), var(--summary-overlay));
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    .summary-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 18px;
      height: 2px;
      background: var(--warning);
    }

    .summary-label {
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .card-grid {
      grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
      gap: 10px;
    }

    .doll-card {
      isolation: isolate;
      padding: 12px 13px 13px;
      border-radius: 3px;
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 42%),
        linear-gradient(90deg, color-mix(in srgb, var(--attr-color) 4%, transparent), transparent 34%),
        var(--panel);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
    }

    .doll-card::before {
      width: 4px;
      box-shadow: 7px 0 20px color-mix(in srgb, var(--attr-color) 18%, transparent);
    }

    .doll-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      right: 0;
      width: 27px;
      height: 2px;
      background: var(--warning);
      opacity: .88;
    }

    .card-title-line {
      position: relative;
      min-width: 0;
      margin-bottom: 9px;
      padding: 0 2px 8px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
    }

    .card-title-line::after {
      content: "";
      position: absolute;
      left: 2px;
      bottom: -1px;
      width: 46px;
      height: 2px;
      background: var(--attr-color, var(--accent));
    }

    .card-identity {
      gap: 12px;
      align-items: stretch;
    }

    .doll-portrait {
      width: 110px;
      height: 144px;
      border-radius: 2px;
      border-color: color-mix(in srgb, var(--attr-color) 58%, var(--line));
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        linear-gradient(150deg, color-mix(in srgb, var(--attr-color) 18%, transparent), transparent 64%),
        var(--panel-3);
      background-size: 15px 15px, 15px 15px, auto, auto;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--panel-sheen) 55%, transparent);
    }

    .doll-portrait::before {
      content: "DOLL";
      position: absolute;
      z-index: 2;
      top: 5px;
      left: 7px;
      color: color-mix(in srgb, var(--attr-color) 75%, var(--text));
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .18em;
      opacity: .72;
      pointer-events: none;
    }

    .doll-portrait {
      --portrait-scale: 3.5;
      --portrait-offset-y: -7%;
    }

    .doll-portrait img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      transform: translateY(var(--portrait-offset-y)) scale(var(--portrait-scale));
      transform-origin: center top;
      background: transparent;
    }

    .doll-portrait .portrait-fallback {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 24px 9px 27px;
      color: var(--portrait-text);
      font-size: clamp(12px, 1.15vw, 17px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -.04em;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: anywhere;
      transition: opacity .16s ease, visibility .16s ease;
    }

    .doll-portrait.has-image .portrait-fallback {
      opacity: 0;
      visibility: hidden;
    }

    .identity-text {
      display: flex;
      min-width: 0;
      min-height: 144px;
      flex: 1;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 1px;
    }

    .doll-name {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(20px, 2vw, 23px);
      font-weight: 950;
      line-height: 1.12;
      letter-spacing: -.035em;
      text-overflow: ellipsis;
      white-space: nowrap;
      word-break: keep-all;
    }

    .meta-row { margin-top: 0; }

    .tag,
    .option-tag {
      min-height: 21px;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10.5px;
      letter-spacing: .01em;
    }

    .status-controls {
      justify-content: flex-start;
      max-width: none;
      margin-top: 7px;
      gap: 4px;
    }

    .status-chip {
      min-height: 27px;
      padding: 4px 7px;
      border-radius: 3px;
      background: var(--panel-2);
      font-size: 10.5px;
    }

    .compact-config {
      margin-top: 7px;
    }

    .compact-config .config-title {
      margin-bottom: 4px;
    }

    .status-chip.active[data-status="tracked"] { box-shadow: inset 3px 0 0 var(--accent); }
    .status-chip.active[data-status="unowned"] { box-shadow: inset 3px 0 0 var(--warning); }
    .status-chip.active[data-status="completed"] { box-shadow: inset 3px 0 0 var(--success); }

    .config-block {
      margin-top: 9px;
      padding-top: 8px;
      border-top-style: solid;
      border-top-color: color-mix(in srgb, var(--line) 78%, transparent);
    }

    .config-title {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9.5px;
      letter-spacing: .11em;
    }

    .piece-grid {
      gap: 5px;
      margin-top: 8px;
    }

    .piece-button,
    .card-note,
    .key-box,
    .personal-note-field textarea {
      border-radius: 3px;
    }

    .piece-button {
      min-height: 38px;
      padding: 6px 8px;
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 52%),
        var(--panel-2);
    }

    .card-note,
    .key-box {
      margin-top: 8px;
      padding: 7px 9px;
    }

    .card-note {
      background: var(--orange-soft);

    .personal-note-field { margin-top: 8px; }
    .personal-note-field span { margin-bottom: 4px; }
    .personal-note-field textarea {
      min-height: 54px;
      padding: 8px 9px;
    }

    .card-actions {
      padding-top: 9px;
    }

    .reference-section,
    .modal,
    .empty-state,
    .loading-state,
    .toast {
      border-radius: 3px;
    }

    .reference-section {
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    th { background: var(--panel-3); }

    :root[data-theme="light"] th { background: #e8eff3; }
    :root[data-theme="light"] th:first-child { background: #e1eaef; }

    @media (max-width: 900px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .doll-card { padding: 11px; }
      .card-title-line { margin-bottom: 8px; padding-bottom: 7px; }
      .doll-portrait { width: 102px; height: 134px; }

      .status-chip { padding-inline: 6px; font-size: 10px; }
      .piece-grid { grid-template-columns: 1fr 1fr; }
    }



    /* v13: 카드 높이 통일, 장비 옵션 묶음, 인형별 일러스트 프리셋 */
    .card-grid {
      align-items: stretch;
      grid-auto-rows: 1fr;
    }

    .doll-card {
      min-height: 100%;
      height: 100%;
      align-self: stretch;
    }

    .card-identity { flex: 0 0 auto; }

    .gear-options-panel {
      display: grid;
      gap: 6px;
      margin-top: 9px;
      padding: 8px;
      border: 1px solid color-mix(in srgb, var(--line) 88%, transparent);
      background:
        linear-gradient(135deg, var(--panel-sheen), transparent 52%),
        var(--panel-2);
    }

    .gear-option-row {
      display: grid;
      grid-template-columns: 49px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 7px;
      min-height: 29px;
    }

    .gear-option-row + .gear-option-row {
      padding-top: 6px;
      border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    }

    .gear-option-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .gear-done-toggle {
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--faint);
      border-radius: 4px;
      background: transparent;
      color: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 950;
      transition: .15s ease;
    }

    .gear-done-toggle:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .gear-done-toggle.done {
      border-color: var(--success);
      background: var(--success);
      color: var(--check-text);
    }

    .key-box {
      min-height: 78px;
      display: flex;
      flex-direction: column;
    }

    .key-box .key-effect {
      min-height: 3.1em;
      margin-top: 3px;
    }

    .key-box.empty strong { color: var(--faint); }

    .portrait-position,
    .portrait-zoom {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .portrait-position {
      transform: translate(var(--portrait-user-x, 0%), var(--portrait-user-y, -7%));
    }

    .portrait-zoom {
      transform: scale(var(--portrait-user-scale, 3.5));
      transform-origin: center top;
    }

    .portrait-zoom .portrait-image {
      transform: none;
      transform-origin: center center;
    }

    @media (max-width: 900px) {
      .card-grid { grid-auto-rows: auto; }
      .doll-card { min-height: 0; height: auto; }
    }

</head>

  <script>
    'use strict';

    const STORAGE_KEY = 'gf2-personal-farming-v2-supabase';
    const UI_STORAGE_KEY = 'gf2-personal-farming-ui-v2-supabase';
    const THEME_STORAGE_KEY = 'gf2-ui-theme-v1';
    const SLOT_LABELS = {
      muzzle: '총구',
      p1: '파츠 1',
      p2: '파츠 2',
      p3: '파츠 3'
    };

    const ATTR_COLORS = {
      '물리': 'var(--physical)',
      '연소': 'var(--burn)',
      '빙결': 'var(--freeze)',
      '전도': 'var(--electric)',
      '산성': 'var(--acid)',
      '탁류': 'var(--turbid)',
      '공진': 'var(--resonance)'
    };

    const app = {
      data: null,
      personal: loadPersonalData(),
      activeTab: 'farm',
      query: '',
      weaponFilters: new Set(),
      attrFilters: new Set(),
      scope: 'all',
      hideUnowned: loadUiPreferences().hideUnowned,
      editorName: null,
      editorDraft: null,
      referenceRendered: false,
      supabase: null
    };

    function loadUiPreferences() {
      try {
        const raw = localStorage.getItem(UI_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return { hideUnowned: Boolean(parsed?.hideUnowned) };
      } catch (error) {
        console.error('화면 설정 불러오기 실패', error);
        return { hideUnowned: false };
      }
    }

    function saveUiPreferences() {
      try {
        localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
          hideUnowned: app.hideUnowned
        }));
      } catch (error) {
        console.error('화면 설정 저장 실패', error);
      }
    }

    function currentTheme() {
      return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
    }

    function applyTheme(theme, persist = true) {
      const next = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      const icon = document.getElementById('themeToggleIcon');
      const button = document.getElementById('themeToggleButton');
      if (icon) icon.textContent = next === 'dark' ? '☀' : '🌙';
      if (button) {
        button.setAttribute('aria-label', next === 'dark' ? '밝은 화면으로 전환' : '어두운 화면으로 전환');
        button.setAttribute('title', next === 'dark' ? '밝은 화면으로 전환' : '어두운 화면으로 전환');
      }
      if (persist) {
        try { localStorage.setItem(THEME_STORAGE_KEY, next); }
        catch (error) { console.error('테마 저장 실패', error); }
      }
    }

    function personalStorageKey() {
      return `${STORAGE_KEY}:guest`;
    }

    function loadPersonalData() {
      try {
        const raw = localStorage.getItem(personalStorageKey());
        const parsed = raw ? JSON.parse(raw) : {};
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (error) {
        console.error('개인 데이터 불러오기 실패', error);
        return {};
      }
    }

    function savePersonalData() {
      try {
        localStorage.setItem(personalStorageKey(), JSON.stringify(app.personal));
      } catch (error) {
        console.error('개인 데이터 저장 실패', error);
        showToast('브라우저에 저장하지 못했습니다.', true);
      }
    }

    function defaultConfig(doll) {
      return {
        status: 'none',
        personalNote: doll.note || '',
        noteInitialized: true,
        setOptions: [...doll.setOptions],
        muzzle: [...doll.muzzle],
        parts: [
          [...doll.part],
          [...doll.part],
          [...doll.part]
        ],
        done: {
          muzzle: false,
          p1: false,
          p2: false,
          p3: false
        }
      };
    }

    function getConfig(doll) {
      const saved = app.personal[doll.name];
      const base = defaultConfig(doll);

      if (!saved || typeof saved !== 'object') return base;

      const legacyStatus = saved.completed
        ? 'completed'
        : saved.unowned
          ? 'unowned'
          : saved.tracked
            ? 'tracked'
            : 'none';
      const status = ['none', 'tracked', 'unowned', 'completed'].includes(saved.status)
        ? saved.status
        : legacyStatus;

      const config = {
        status,
        personalNote: typeof saved.personalNote === 'string' ? saved.personalNote : base.personalNote,
        noteInitialized: Boolean(saved.noteInitialized),
        setOptions: Array.isArray(saved.setOptions) ? [...saved.setOptions] : base.setOptions,
        muzzle: Array.isArray(saved.muzzle) ? [...saved.muzzle].slice(0, 4) : base.muzzle,
        parts: [0, 1, 2].map(index => (
          Array.isArray(saved.parts?.[index])
            ? [...saved.parts[index]].slice(0, 3)
            : base.parts[index]
        )),
        done: {
          muzzle: Boolean(saved.done?.muzzle),
          p1: Boolean(saved.done?.p1),
          p2: Boolean(saved.done?.p2),
          p3: Boolean(saved.done?.p3)
        }
      };

      if (config.status === 'completed') {
        Object.keys(config.done).forEach(slot => { config.done[slot] = true; });
      }

      return config;
    }

    function setConfig(name, config) {
      app.personal[name] = config;
      savePersonalData();
      app.referenceRendered = false;
      if (app.activeTab === 'reference') renderReference();
    }

    function migratePersonalNotes() {
      let changed = false;

      app.data.dolls.forEach(doll => {
        if (!doll.note) return;

        const saved = app.personal[doll.name];
        if (!saved || typeof saved !== 'object') {
          app.personal[doll.name] = {
            personalNote: doll.note,
            noteInitialized: true
          };
          changed = true;
          return;
        }

        if (saved.noteInitialized === true) return;

        if (typeof saved.personalNote !== 'string' || !saved.personalNote.trim()) {
          saved.personalNote = doll.note;
        }
        saved.noteInitialized = true;
        changed = true;
      });

      if (changed) savePersonalData();
    }

    function findDoll(name) {
      return app.data?.dolls.find(doll => doll.name === name) || null;
    }

    async function init() {
      applyTheme(currentTheme(), false);
      bindStaticEvents();
      try {
        const cfg = window.GF2_CONFIG || {};
        if (!cfg.supabaseUrl || !cfg.supabasePublishableKey || cfg.supabaseUrl.includes('YOUR_PROJECT')) {
          throw new Error('config.js에 Supabase URL과 Publishable Key를 입력해주세요.');
        }
        app.supabase = window.supabase.createClient(
          cfg.supabaseUrl,
          cfg.supabasePublishableKey,
          { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
        );
        await loadAppData();
      } catch (error) {
        handleDataFailure(error);
      }
    }

    async function loadAppData() {
      const { data: rows, error } = await app.supabase
        .from('dolls')
        .select('*')
        .eq('is_active', true)
        .order('display_order', { ascending: false })
        .order('name', { ascending: false });
      if (error) throw error;

      const setOptions = unique(rows.flatMap(row => row.recommended_sets || []));
      const statOptions = unique(rows.flatMap(row => [
        ...(row.recommended_muzzle || []), ...(row.recommended_parts || [])
      ]));
      const weaponOrder = ['돌격소총','산탄총','기관단총','기관총','저격소총','권총','도검'];
      const attrOrder = ['물리','연소','빙결','전도','산성','탁류','공진'];
      const data = {
        spreadsheetId: '',
        spreadsheetName: 'Supabase DB',
        sourceUrl: '',
        dolls: rows.map(row => ({
          id: row.id,
          slug: row.slug,
          name: row.name,
          weapon: row.weapon_type,
          attr: row.attribute,
          setOptions: row.recommended_sets || [],
          muzzle: row.recommended_muzzle || [],
          part: row.recommended_parts || [],
          note: row.default_note || '',
          keyName: row.common_key || '',
          keyEffect: row.common_key_effect || '',
          imageUrl: row.image_url || '',
          portraitScale: (() => {
            const raw = Number(row.portrait_scale ?? 250);
            return raw >= .6 && raw <= 1.6 ? raw * 350 - 100 : raw;
          })(),
          portraitOffsetX: Number(row.portrait_offset_x ?? 0),
          portraitOffsetY: (() => {
            const rawScale = Number(row.portrait_scale ?? 250);
            const rawY = Number(row.portrait_offset_y ?? (rawScale >= .6 && rawScale <= 1.6 ? 0 : -7));
            return rawScale >= .6 && rawScale <= 1.6 ? rawY - 7 : rawY;
          })()
        })),
        setOptions,
        statOptions,
        weapons: orderedUnique(weaponOrder, rows.map(row => row.weapon_type).filter(x => x && x !== '기타')),
        attrs: orderedUnique(attrOrder, rows.map(row => row.attribute).filter(Boolean))
      };
      handleDataLoaded(data);
    }

    function orderedUnique(preferred, values) {
      const all = unique(values);
      return [...preferred.filter(v => all.includes(v)), ...all.filter(v => !preferred.includes(v))];
    }

    function unique(values) {
      return [...new Set((values || []).filter(Boolean))];
    }

    function handleDataLoaded(data) {
      app.data = data;
      migratePersonalNotes();
      document.getElementById('sourceStatus').textContent =
        `${data.spreadsheetName} · ${data.dolls.length}인형`;
      document.querySelectorAll('[data-footer-source]').forEach(footer => {
        footer.textContent = '공용 인형 데이터는 Supabase에서 읽고, 개인 진행 상황은 이 브라우저에만 저장합니다.';
      });

      renderFilterChips();
      document.getElementById('hideUnownedButton').classList.toggle('active', app.hideUnowned);
      renderFarm();
    }

    function handleDataFailure(error) {
      console.error(error);
      document.getElementById('sourceStatus').textContent = '데이터를 불러오지 못했습니다.';
      document.getElementById('dollGrid').innerHTML = `
        <div class="empty-state">
          데이터 불러오기 실패<br>
          ${escapeHtml(error?.message || String(error))}
        </div>`;
    }

    function bindStaticEvents() {
      document.getElementById('themeToggleButton').addEventListener('click', () => {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
      });

      document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
      });


      document.getElementById('searchInput').addEventListener('input', event => {
        app.query = event.target.value.trim().toLowerCase();
        renderFarm();
      });

      document.getElementById('scopeFilters').addEventListener('click', event => {
        const scopeButton = event.target.closest('[data-scope]');
        if (scopeButton) {
          app.scope = scopeButton.dataset.scope;
          document.querySelectorAll('[data-scope]').forEach(item => {
            item.classList.toggle('active', item.dataset.scope === app.scope);
          });
          renderFarm();
          return;
        }

        const toggleButton = event.target.closest('[data-toggle="hide-unowned"]');
        if (!toggleButton) return;
        app.hideUnowned = !app.hideUnowned;
        toggleButton.classList.toggle('active', app.hideUnowned);
        saveUiPreferences();
        renderFarm();
      });

      document.getElementById('dollGrid').addEventListener('click', handleCardClick);
      document.getElementById('dollGrid').addEventListener('change', handleCardChange);

      document.getElementById('closeEditorButton').addEventListener('click', closeEditor);
      document.getElementById('cancelEditorButton').addEventListener('click', closeEditor);
      document.getElementById('saveEditorButton').addEventListener('click', saveEditor);
      document.getElementById('restoreRecommendedButton').addEventListener('click', restoreRecommendedInEditor);

      document.getElementById('editorBackdrop').addEventListener('click', event => {
        if (event.target.id === 'editorBackdrop') closeEditor();
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeEditor();
      });

      document.getElementById('resetAllButton').addEventListener('click', resetAllPersonalData);
      document.getElementById('toggleReferenceButton').addEventListener('click', toggleAllReferenceSections);
    }

    function switchTab(tab) {
      if (!['farm', 'reference'].includes(tab) || tab === app.activeTab) return;

      app.activeTab = tab;

      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.toggle('active', button.dataset.tab === tab);
      });
      document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
      document.getElementById(tab === 'farm' ? 'farmView' : 'referenceView').classList.add('active');

      if (tab === 'reference' && app.data) {
        renderReference();
      }
    }

    function renderFilterChips() {
      renderChipContainer('weaponFilters', app.data.weapons, 'weapon');
      renderChipContainer('attrFilters', app.data.attrs, 'attr');
    }

    function renderChipContainer(containerId, values, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = values.map(value => `
        <button class="filter-chip" type="button" data-filter-type="${type}" data-value="${escapeAttr(value)}">
          ${escapeHtml(value)}
        </button>`).join('');

      container.addEventListener('click', event => {
        const button = event.target.closest('[data-value]');
        if (!button) return;

        const set = button.dataset.filterType === 'weapon'
          ? app.weaponFilters
          : app.attrFilters;
        const value = button.dataset.value;

        if (set.has(value)) set.delete(value);
        else set.add(value);

        button.classList.toggle('active', set.has(value));
        renderFarm();
      });
    }

    function filteredDolls() {
      if (!app.data) return [];

      return app.data.dolls.filter(doll => {
        const config = getConfig(doll);
        const searchable = [
          doll.name,
          doll.weapon,
          doll.attr,
          doll.keyName,
          doll.keyEffect,
          config.personalNote,
          ...config.setOptions
        ].join(' ').toLowerCase();

        if (app.query && !searchable.includes(app.query)) return false;
        if (app.weaponFilters.size && !app.weaponFilters.has(doll.weapon)) return false;
        if (app.attrFilters.size && !app.attrFilters.has(doll.attr)) return false;
        if (app.hideUnowned && config.status === 'unowned') return false;
        if (app.scope === 'tracked' && config.status !== 'tracked') return false;
        if (app.scope === 'incomplete' && (config.status === 'unowned' || isConfigComplete(config))) return false;
        if (app.scope === 'completed' && !isConfigComplete(config)) return false;
        return true;
      });
    }

    function renderFarm() {
      if (!app.data) return;

      renderSummary();
      const dolls = filteredDolls();
      const grid = document.getElementById('dollGrid');

      if (!dolls.length) {
        grid.innerHTML = '<div class="empty-state">조건에 맞는 인형이 없습니다.</div>';
        return;
      }

      grid.innerHTML = dolls.map(renderDollCard).join('');
    }

    function renderSummary() {
      const allConfigs = app.data.dolls.map(doll => getConfig(doll));
      const trackedConfigs = allConfigs.filter(config => config.status === 'tracked');
      const unownedConfigs = allConfigs.filter(config => config.status === 'unowned');
      const completedConfigs = allConfigs.filter(config => isConfigComplete(config));
      const progressConfigs = allConfigs.filter(config => (
        config.status === 'tracked' || isConfigComplete(config)
      ));
      const donePieces = progressConfigs.reduce((sum, config) => (
        sum + Object.values(config.done).filter(Boolean).length
      ), 0);
      const totalPieces = progressConfigs.length * 4;
      const percent = totalPieces ? Math.round(donePieces / totalPieces * 100) : 0;

      document.getElementById('summaryGrid').innerHTML = `
        ${summaryCard('전체 인형', app.data.dolls.length)}
        ${summaryCard('파밍 대상', trackedConfigs.length)}
        ${summaryCard('미보유', unownedConfigs.length)}
        ${summaryCard('파밍 완료', completedConfigs.length)}
        <div class="summary-card">
          <div class="summary-label">파츠 진행률</div>
          <div class="summary-value">${donePieces} / ${totalPieces}</div>
          <div class="progress-line"><span style="width:${percent}%"></span></div>
        </div>`;
    }

    function summaryCard(label, value) {
      return `
        <div class="summary-card">
          <div class="summary-label">${escapeHtml(label)}</div>
          <div class="summary-value">${value}</div>
        </div>`;
    }

    function renderDollCard(doll) {
      const config = getConfig(doll);
      const encodedName = encodeURIComponent(doll.name);
      const color = ATTR_COLORS[doll.attr] || 'var(--faint)';

      return `
        <article class="doll-card status-${config.status}" style="--attr-color:${color}" data-name="${encodedName}">
          <div class="card-title-line">
            <h2 class="doll-name" title="${escapeHtml(doll.name)}">${escapeHtml(doll.name)}</h2>
          </div>

          <div class="card-identity">
            ${renderDollPortrait(doll)}
            <div class="identity-text">
              <div class="meta-row">
                <span class="tag">${escapeHtml(doll.weapon)}</span>
                ${doll.attr ? `<span class="tag attr">${escapeHtml(doll.attr)}</span>` : ''}
              </div>

              <div class="status-controls" aria-label="인형 상태">
                <button class="status-chip ${config.status === 'tracked' ? 'active' : ''}" type="button" data-action="set-status" data-status="tracked">파밍 대상</button>
                <button class="status-chip ${config.status === 'unowned' ? 'active' : ''}" type="button" data-action="set-status" data-status="unowned">미보유</button>
                <button class="status-chip ${config.status === 'completed' ? 'active' : ''}" type="button" data-action="set-status" data-status="completed">파밍 완료</button>
              </div>

              <div class="compact-config">
                <div class="config-title"><span>세트 옵션</span></div>
                <div class="option-row">${renderOptionTags(config.setOptions, 'set')}</div>
              </div>
            </div>
          </div>

          <div class="gear-options-panel" aria-label="총구와 파츠 옵션">
            ${[
              ['muzzle', '총구', config.muzzle],
              ['p1', '파츠 1', config.parts[0]],
              ['p2', '파츠 2', config.parts[1]],
              ['p3', '파츠 3', config.parts[2]]
            ].map(([slot, label, options]) => `
              <div class="gear-option-row">
                <span class="gear-option-label">${label}</span>
                <div class="option-row">${renderOptionTags(options)}</div>
                <button
                  class="gear-done-toggle ${config.done[slot] ? 'done' : ''}"
                  type="button"
                  data-action="toggle-done"
                  data-slot="${slot}"
                  aria-pressed="${config.done[slot] ? 'true' : 'false'}"
                  aria-label="${label} 완료 체크"
                  title="${label} 완료 체크"
                >✓</button>
              </div>`).join('')}
          </div>

          <label class="personal-note-field">
            <span>개인 비고</span>
            <textarea data-action="personal-note" maxlength="500" placeholder="시트 비고가 기본 입력되며 자유롭게 수정할 수 있습니다.">${escapeHtml(config.personalNote)}</textarea>
          </label>
          <div class="key-box${doll.keyName ? '' : ' empty'}">
            <strong>공용키 · ${doll.keyName ? escapeHtml(doll.keyName) : '미등록'}</strong>
            <div class="key-effect">${doll.keyName ? (escapeHtml(doll.keyEffect) || '&nbsp;') : '&nbsp;<br>&nbsp;'}</div>
          </div>

          <div class="card-actions">
            <button class="button small primary" type="button" data-action="edit">구성 편집</button>
            <button class="button small ghost" type="button" data-action="reset-doll">추천값 복원</button>
          </div>
        </article>`;
    }

    function renderDollPortrait(doll) {
      const fullName = String(doll.name || '이름 없음');
      const portraitZoom = Math.min(500, Math.max(-40, Number(doll.portraitScale) || 0));
      const portraitScale = Math.max(.6, 1 + portraitZoom / 100);
      const portraitOffsetX = Math.min(50, Math.max(-50, Number(doll.portraitOffsetX) || 0));
      const portraitOffsetY = Math.min(50, Math.max(-50, Number(doll.portraitOffsetY) || 0));
      const portraitStyle = [
        `--portrait-user-scale:${portraitScale}`,
        `--portrait-user-x:${portraitOffsetX}%`,
        `--portrait-user-y:${portraitOffsetY}%`
      ].join(';');
      const image = doll.imageUrl
        ? `<span class="portrait-position"><span class="portrait-zoom"><img class="portrait-image" src="${escapeAttr(doll.imageUrl)}" alt="${escapeAttr(fullName)} 일러스트" loading="lazy" decoding="async" onload="this.classList.add('loaded'); const portrait=this.closest('.doll-portrait'); portrait?.classList.add('has-image'); portrait?.classList.remove('empty')" onerror="const portrait=this.closest('.doll-portrait'); portrait?.classList.remove('has-image'); portrait?.classList.add('empty'); this.closest('.portrait-position')?.remove()"></span></span>`
        : '';

      return `
        <div class="doll-portrait${doll.imageUrl ? '' : ' empty'}" style="${portraitStyle}" aria-label="${escapeAttr(fullName)} 일러스트">
          <span class="portrait-fallback">${escapeHtml(fullName)}</span>
          ${image}
        </div>`;
    }

    function renderOptionTags(options, className = '') {
      if (!options?.length) return '<span class="tag">미선택</span>';
      return options.map(value => `<span class="option-tag ${className}">${escapeHtml(value)}</span>`).join('');
    }

    function updateFarmCardState(doll, config) {
      const grid = document.getElementById('dollGrid');
      const encodedName = encodeURIComponent(doll.name);
      const card = [...grid.querySelectorAll('.doll-card')]
        .find(item => item.dataset.name === encodedName);

      renderSummary();

      if (!card) return;

      const remainsVisible = filteredDolls().some(item => item.name === doll.name);
      if (!remainsVisible) {
        card.remove();
        if (!grid.querySelector('.doll-card')) {
          grid.innerHTML = '<div class="empty-state">조건에 맞는 인형이 없습니다.</div>';
        }
        return;
      }

      card.classList.remove('status-none', 'status-tracked', 'status-unowned', 'status-completed');
      card.classList.add(`status-${config.status}`);

      card.querySelectorAll('[data-action="set-status"]').forEach(button => {
        button.classList.toggle('active', button.dataset.status === config.status);
      });

      card.querySelectorAll('[data-action="toggle-done"]').forEach(button => {
        const isDone = Boolean(config.done[button.dataset.slot]);
        button.classList.toggle('done', isDone);
        button.setAttribute('aria-pressed', String(isDone));
      });
    }

    function handleCardClick(event) {
      const actionElement = event.target.closest('[data-action]');
      if (!actionElement) return;
      const card = actionElement.closest('[data-name]');
      if (!card) return;

      const name = decodeURIComponent(card.dataset.name);
      const doll = findDoll(name);
      if (!doll) return;

      const action = actionElement.dataset.action;
      if (action === 'set-status') setDollStatus(doll, actionElement.dataset.status);
      if (action === 'toggle-done') toggleDone(doll, actionElement.dataset.slot);
      if (action === 'edit') openEditor(doll);
      if (action === 'reset-doll') resetDoll(doll);
    }

    function handleCardChange(event) {
      if (event.target.dataset.action !== 'personal-note') return;
      const card = event.target.closest('[data-name]');
      const name = decodeURIComponent(card.dataset.name);
      const doll = findDoll(name);
      if (!doll) return;

      const config = getConfig(doll);
      config.personalNote = event.target.value.trim();
      config.noteInitialized = true;
      setConfig(doll.name, config);
      showToast(`${doll.name} 개인 비고를 저장했습니다.`);
    }

    function setDollStatus(doll, nextStatus) {
      const config = getConfig(doll);
      const previousStatus = config.status;
      config.status = previousStatus === nextStatus ? 'none' : nextStatus;

      if (config.status === 'completed') {
        Object.keys(config.done).forEach(slot => { config.done[slot] = true; });
      } else if (previousStatus === 'completed' || config.status === 'unowned') {
        Object.keys(config.done).forEach(slot => { config.done[slot] = false; });
      }

      setConfig(doll.name, config);
      updateFarmCardState(doll, config);
    }

    function toggleDone(doll, slot) {
      const config = getConfig(doll);
      config.done[slot] = !config.done[slot];
      config.status = Object.values(config.done).every(Boolean) ? 'completed' : 'tracked';
      setConfig(doll.name, config);
      updateFarmCardState(doll, config);
    }

    function resetDoll(doll) {
      if (!confirm(`${doll.name}의 개인 구성과 완료 체크를 추천 기본값으로 되돌릴까요?`)) return;
      const current = getConfig(doll);
      const base = defaultConfig(doll);
      base.status = current.status;
      base.personalNote = current.personalNote;
      base.noteInitialized = true;
      setConfig(doll.name, base);
      renderFarm();
      showToast(`${doll.name} 구성을 추천값으로 복원했습니다.`);
    }

    function isConfigComplete(config) {
      return config.status !== 'unowned' && (config.status === 'completed' || Object.values(config.done).every(Boolean));
    }

    function openEditor(doll) {
      app.editorName = doll.name;
      app.editorDraft = structuredCloneSafe(getConfig(doll));
      renderEditor();
      document.getElementById('editorBackdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeEditor() {
      document.getElementById('editorBackdrop').classList.remove('open');
      document.body.style.overflow = '';
      app.editorName = null;
      app.editorDraft = null;
    }

    function renderEditor() {
      const doll = findDoll(app.editorName);
      if (!doll || !app.editorDraft) return;

      document.getElementById('editorTitle').textContent = `${doll.name} 장비 구성`;
      const groups = [
        {
          key: 'setOptions',
          label: '세트 옵션',
          help: '여러 개 선택 가능',
          options: app.data.setOptions,
          recommended: doll.setOptions,
          selected: app.editorDraft.setOptions,
          max: null
        },
        {
          key: 'muzzle',
          label: '총구 옵션',
          help: '최대 4개',
          options: app.data.statOptions,
          recommended: doll.muzzle,
          selected: app.editorDraft.muzzle,
          max: 4
        },
        ...[0, 1, 2].map(index => ({
          key: `part-${index}`,
          label: `파츠 ${index + 1} 옵션`,
          help: '최대 3개',
          options: app.data.statOptions,
          recommended: doll.part,
          selected: app.editorDraft.parts[index],
          max: 3
        }))
      ];

      const body = document.getElementById('editorBody');
      body.innerHTML = groups.map(group => `
        <section class="editor-group">
          <div class="editor-heading">
            <strong>${escapeHtml(group.label)}</strong>
            <span>${escapeHtml(group.help)} · 현재 ${group.selected.length}개</span>
          </div>
          <div class="choice-grid">
            ${group.options.map(option => `
              <button
                class="choice-chip ${group.selected.includes(option) ? 'selected' : ''} ${group.recommended.includes(option) ? 'recommended' : ''}"
                type="button"
                data-editor-key="${group.key}"
                data-value="${escapeAttr(option)}"
                data-max="${group.max ?? ''}"
              >${escapeHtml(option)}</button>`).join('')}
          </div>
        </section>`).join('');

      body.querySelectorAll('[data-editor-key]').forEach(button => {
        button.addEventListener('click', () => handleEditorChoice(button));
      });
    }

    function handleEditorChoice(button) {
      const key = button.dataset.editorKey;
      const value = button.dataset.value;
      const max = button.dataset.max ? Number(button.dataset.max) : null;
      const selected = key === 'setOptions'
        ? app.editorDraft.setOptions
        : key === 'muzzle'
          ? app.editorDraft.muzzle
          : app.editorDraft.parts[Number(key.split('-')[1])];

      const index = selected.indexOf(value);
      if (index >= 0) {
        selected.splice(index, 1);
      } else {
        if (max && selected.length >= max) {
          showToast(`최대 ${max}개까지 선택할 수 있습니다.`, true);
          return;
        }
        selected.push(value);
      }

      renderEditor();
    }

    function restoreRecommendedInEditor() {
      const doll = findDoll(app.editorName);
      if (!doll) return;
      const status = app.editorDraft.status;
      const personalNote = app.editorDraft.personalNote;
      const noteInitialized = app.editorDraft.noteInitialized;
      const done = structuredCloneSafe(app.editorDraft.done);
      app.editorDraft = defaultConfig(doll);
      app.editorDraft.status = status;
      app.editorDraft.personalNote = personalNote;
      app.editorDraft.noteInitialized = noteInitialized;
      app.editorDraft.done = done;
      renderEditor();
      showToast('추천 옵션을 다시 선택했습니다.');
    }

    function saveEditor() {
      const doll = findDoll(app.editorName);
      if (!doll || !app.editorDraft) return;

      if (app.editorDraft.status === 'none') app.editorDraft.status = 'tracked';
      setConfig(doll.name, app.editorDraft);
      closeEditor();
      renderFarm();
      showToast(`${doll.name} 구성을 저장했습니다.`);
    }

    function renderReference() {
      if (!app.data) return;
      const container = document.getElementById('referenceContent');
      const sections = [];
      const effective = app.data.dolls.map(doll => ({
        doll,
        config: getConfig(doll)
      }));

      const muzzleEntries = effective.map(({ doll, config }) => ({
        doll,
        label: doll.name,
        options: config.muzzle
      }));
      const muzzleRows = groupReferenceEntries(muzzleEntries);
      sections.push(referenceSection('총구 옵션', muzzleRows, true));

      const selectedSetNames = new Set();
      effective.forEach(({ config }) => {
        config.setOptions.forEach(setOption => selectedSetNames.add(setOption));
      });
      const effectiveSetOptions = [
        ...app.data.setOptions.filter(option => selectedSetNames.has(option)),
        ...[...selectedSetNames].filter(option => !app.data.setOptions.includes(option))
      ];

      effectiveSetOptions.forEach(setOption => {
        const entries = [];

        effective
          .filter(({ config }) => config.setOptions.includes(setOption))
          .forEach(({ doll, config }) => {
            const combinations = new Map();

            config.parts.forEach((options, index) => {
              const normalized = sortStatOptions(options);
              if (!normalized.length) return;
              const key = normalized.join(', ');
              if (!combinations.has(key)) {
                combinations.set(key, { options: normalized, slots: [] });
              }
              combinations.get(key).slots.push(index + 1);
            });

            combinations.forEach(value => {
              const label = combinations.size === 1
                ? doll.name
                : `${doll.name} (파츠 ${value.slots.join('·')})`;
              entries.push({ doll, label, options: value.options });
            });
          });

        const rows = groupReferenceEntries(entries);
        if (rows.length) sections.push(referenceSection(setOption, rows, false));
      });

      container.innerHTML = sections.join('') || '<div class="empty-state">표시할 개인 장비 구성이 없습니다.</div>';
      app.referenceRendered = true;
    }

    function referenceWeapons() {
      return app.data.weapons.filter(weapon => weapon && weapon !== '기타');
    }

    function sortStatOptions(options) {
      return [...new Set(options || [])].sort((a, b) => {
        const ai = app.data.statOptions.indexOf(a);
        const bi = app.data.statOptions.indexOf(b);
        const aRank = ai === -1 ? Number.MAX_SAFE_INTEGER : ai;
        const bRank = bi === -1 ? Number.MAX_SAFE_INTEGER : bi;
        return aRank - bRank || a.localeCompare(b, 'ko');
      });
    }

    function groupReferenceEntries(entries) {
      const map = new Map();
      const weapons = referenceWeapons();

      entries.forEach(entry => {
        const weapon = entry.doll.weapon;
        if (!weapons.includes(weapon)) return;

        const options = sortStatOptions(entry.options);
        if (!options.length) return;

        const key = options.join(', ');
        if (!map.has(key)) map.set(key, {});
        if (!map.get(key)[weapon]) map.get(key)[weapon] = [];
        if (!map.get(key)[weapon].includes(entry.label)) {
          map.get(key)[weapon].push(entry.label);
        }
      });

      return [...map.entries()]
        .map(([combination, groupedWeapons]) => ({ combination, weapons: groupedWeapons }))
        .sort((a, b) => a.combination.localeCompare(b.combination, 'ko'));
    }

    function referenceSection(title, rows, open) {
      const weapons = referenceWeapons();
      return `
        <details class="reference-section" ${open ? 'open' : ''}>
          <summary>${escapeHtml(title)} · ${rows.length}개 조합</summary>
          <div class="table-wrap">
            <table class="reference-table">
              <colgroup>
                <col class="option-col">
                ${weapons.map(() => `<col class="weapon-col">`).join('')}
              </colgroup>
              <thead>
                <tr>
                  <th>옵션 조합</th>
                  ${weapons.map(weapon => `<th>${escapeHtml(weapon)}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => `
                  <tr>
                    <td>${escapeHtml(row.combination)}</td>
                    ${weapons.map(weapon => `
                      <td class="cell-names">${escapeHtml((row.weapons[weapon] || []).join(', '))}</td>`).join('')}
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </details>`;
    }

    function toggleAllReferenceSections() {
      const sections = [...document.querySelectorAll('.reference-section')];
      if (!sections.length) return;
      const shouldOpen = sections.some(section => !section.open);
      sections.forEach(section => { section.open = shouldOpen; });
      document.getElementById('toggleReferenceButton').textContent = shouldOpen ? '모두 접기' : '모두 펼치기';
    }

    function exportBackup() {
      const payload = {
        app: '소녀전선2 장비 파밍 도우미',
        version: 4,
        source: 'supabase-public-local-personal',
        exportedAt: new Date().toISOString(),
        personal: app.personal
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `gf2-parts-backup-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
    }

function resetAllPersonalData() {
  const confirmed = confirm(
    '이 브라우저에 저장된 모든 상태, 옵션 구성, 완료 체크, 개인 비고를 초기화할까요?\n\n삭제된 데이터는 복구할 수 없습니다.'
  );

  if (!confirmed) return;

  app.personal = {};
  localStorage.removeItem(personalStorageKey());

  migratePersonalNotes();
  app.referenceRendered = false;

  renderFarm();

  if (app.activeTab === 'reference') {
    renderReference();
  }

  showToast('이 브라우저의 저장 데이터를 전체 초기화했습니다.');
}

    let toastTimer = null;
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    function structuredCloneSafe(value) {
      if (typeof structuredClone === 'function') return structuredClone(value);
      return JSON.parse(JSON.stringify(value));
    }

    init();
  </script>
</body>
